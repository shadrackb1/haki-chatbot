# ============================================
# AGRISHIELD — Docker Compose
# Runs AgriShield + PixelAI bots side by side (fully separated)
# ============================================
# Usage:
#   1. Copy .env.production to .env and fill in keys
#   2. docker compose up -d
#   3. docker compose logs -f        (watch both)
#   4. docker compose down           (stop both)
# ============================================

services:
  # ── AGRISHIELD: Human Rights & Agribusiness Bot ──
  haki:
    build:
      context: .
      dockerfile: Dockerfile.haki
    container_name: haki-bot
    restart: always
    env_file: .env
    volumes:
      - haki-auth:/app/auth_info
      - haki-data:/app/data
    environment:
      - BOT_NAME=AgriShield
      - HEALTH_PORT=3001
    ports:
      - "3001:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── PIXEL AI: Personal Assistant Bot ──
  pixelai:
    build:
      context: .
      dockerfile: Dockerfile.pixelai
    container_name: pixelai-bot
    restart: always
    env_file: .env
    volumes:
      - pixelai-auth:/app/auth_info
      - pixelai-data:/app/data
    environment:
      - BOT_NAME=PixelAI
      - HEALTH_PORT=3002
    ports:
      - "3002:3002"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  haki-auth:
  haki-data:
  pixelai-auth:
  pixelai-data:
